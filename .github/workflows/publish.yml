name: Modern Trusted Publish

on:
  push:
    branches:
      - main

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Explicit registry so the unscoped package name always targets npmjs.
      NPM_REGISTRY: https://registry.npmjs.org
      # mcp-publisher runs in a job that can mint OIDC tokens, so it is pinned and checked against a known hash
      # instead of fetching "latest". When the registry starts answering "invalid audience", bump both values
      # (hash: `gh api repos/modelcontextprotocol/registry/releases/tags/<tag>`, asset mcp-publisher_linux_amd64.tar.gz).
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      MCP_REGISTRY_URL: https://registry.modelcontextprotocol.io
    permissions:
      contents: write
      id-token: write
      issues: write
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: corepack enable

      - name: Install & Build
        run: |
          yarn install --immutable
          yarn build

      # The quality gate runs BEFORE semantic-release: a failure after it would leave a tag and a GitHub release
      # for a version that never reached npm (`npm publish` runs prepublishOnly, but only after the tag exists).
      - name: Verify
        run: yarn quality

      # semantic-release versions from the latest v* tag, not package.json.
      # 0.1.6–0.1.10 were published without tags; refuse to run until the tag catches up.
      - name: Require release tag at package version
        run: node scripts/assert-release-tag.mjs

      - name: Run semantic-release
        run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync repository state
        run: |
          git fetch origin main
          git reset --hard origin/main

      # semantic-release exits 0 when there is nothing to release; package.json then matches an
      # already-published version — skip publish to avoid E422 / "cannot publish over".
      # Provenance requires a public source repo; private sources must disable it.
      - name: Publish to npm
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME" version --registry "$NPM_REGISTRY" 2>/dev/null || true)
          if [ -n "$PUBLISHED" ] && [ "$PUBLISHED" = "$VERSION" ]; then
            echo "Skipping npm publish: v${VERSION} is already on ${NPM_REGISTRY}."
            exit 0
          fi
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            NPM_CONFIG_PROVENANCE=false npm publish --access public --registry "$NPM_REGISTRY"
          else
            npm publish --provenance --access public --registry "$NPM_REGISTRY"
          fi

      # Publish to the MCP Registry (OIDC, no stored token)
      # Runs after npm: the registry checks that this version of the package exists there and that its package.json
      # carries the mcpName. server.json is kept at the release version by scripts/sync-server-json.mjs (called from
      # semantic-release, see release.config.mjs), so a push that releases nothing finds its version already listed
      # and publishes nothing.
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version

      - name: Publish to MCP Registry
        run: |
          set -euo pipefail
          PUBLISHER="$RUNNER_TEMP/mcp-publisher"
          SERVER=$(node -p "require('./server.json').name")
          VERSION=$(node -p "require('./server.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::server.json is at ${VERSION} but package.json is at ${PACKAGE_VERSION}"
            exit 1
          fi
          # npm can take minutes to serve a version it has just accepted, and the registry reads it from there.
          for attempt in $(seq 1 20); do
            SEEN=$(npm view "${PACKAGE}@${VERSION}" version --registry "$NPM_REGISTRY" 2>/dev/null || true)
            [ "$SEEN" = "$VERSION" ] && break
            if [ "$attempt" = 20 ]; then
              echo "::error::${PACKAGE}@${VERSION} is not on ${NPM_REGISTRY} after 5 minutes"
              exit 1
            fi
            sleep 15
          done
          # Logging in on every run, even when nothing is published, shows a broken OIDC setup before a release needs it.
          "$PUBLISHER" login github-oidc
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "${MCP_REGISTRY_URL}/v0/servers/${SERVER//\//%2F}/versions/${VERSION}")
          case "$STATUS" in
            200) echo "Skipping MCP Registry: ${SERVER} ${VERSION} is already listed." ;;
            404) "$PUBLISHER" publish ;;
            *) echo "::error::MCP Registry answered ${STATUS} when asked about ${SERVER} ${VERSION}"; exit 1 ;;
          esac
